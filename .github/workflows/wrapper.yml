name: Maven-Wrapper erzeugen (einmalig)
on: workflow_dispatch
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: backend
        run: |
          mvn -B -q -N wrapper:wrapper -Dtype=only-script -Dmaven=3.9.11
          echo "WRAPPER_BEGIN"
          tar czf - mvnw mvnw.cmd .mvn | base64 -w0
          echo
          echo "WRAPPER_END"
