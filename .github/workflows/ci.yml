name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Build, Tests, PMD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, Tests und PMD-Prüfung
        run: ./mvnw -B verify
      - name: Start ohne Docker prüfen (Profil local mit H2)
        env:
          JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
          SSL_ENABLED: "false"
          SERVER_PORT: "8080"
          COOKIE_SECURE: "false"
          ADMIN_EMAIL: admin@battlepedia.local
          ADMIN_PASSWORD: Admin-Passw0rd!
        run: |
          nohup java -jar target/battlepedia-0.1.0.jar --spring.profiles.active=local > local.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/api/auth/me; then break; fi
            sleep 2
          done
          curl -s -c cookies.txt -u "$ADMIN_EMAIL:$ADMIN_PASSWORD" -X POST http://localhost:8080/api/auth/login
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://localhost:8080/api/auth/me)" = "200" \
            || { cat local.log; exit 1; }
          echo "Start mit Profil local funktioniert"
      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
            backend/target/pmd.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (Lint, Format, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Unit-Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Ende-zu-Ende-Tests (Browser + Backend + Datenbank)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: battlepedia
          POSTGRES_USER: battlepedia
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U battlepedia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/battlepedia
      DB_USERNAME: battlepedia
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
      SSL_KEYSTORE_PASSWORD: ci-only-keystore
      FRONTEND_URL: https://localhost:5173
      ADMIN_EMAIL: admin@battlepedia.local
      ADMIN_PASSWORD: Admin-Passw0rd!
      MAIL_ENABLED: "false"
      E2E_ADMIN_EMAIL: admin@battlepedia.local
      E2E_ADMIN_PASSWORD: Admin-Passw0rd!
      BACKEND_LOG: ${{ github.workspace }}/backend/backend.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend bauen und mit HTTPS starten
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          ./scripts/create-dev-certificate.sh "$SSL_KEYSTORE_PASSWORD"
          nohup java -jar target/battlepedia-0.1.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null https://localhost:8443/api/auth/me; then echo "Backend läuft"; exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Frontend und Browser installieren
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ende-zu-Ende-Tests
        working-directory: frontend
        run: npx playwright test
      - name: Backend-Log bei Fehlern anzeigen
        if: failure()
        run: tail -n 100 backend/backend.log
